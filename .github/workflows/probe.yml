# Source check (kildetjek). Runs only on the probe branch.
name: Kildetjek
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node probe/probe.mjs
